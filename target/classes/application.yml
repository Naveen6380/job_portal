server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: job-portal-backend

  datasource:
    url: jdbc:mysql://localhost:3306/job_portal_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:mysql@9087}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # schema.sql is the source of truth, not Hibernate auto-generation
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:naveen.cse666@gmail.com}
    password: ${MAIL_APP_PASSWORD:Work@9087}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ---------------- Custom App Properties ----------------
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_BASE64_SECRET_MIN_256_BITS}
    access-token-expiry-ms: 900000        # 15 minutes
    refresh-token-expiry-ms: 604800000    # 7 days

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:qr6iskbh}
    api-key: ${CLOUDINARY_API_KEY:798215852227798}
    api-secret: ${CLOUDINARY_API_SECRET:**********}

  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

  otp:
    expiry-minutes: 10

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.jobportal: DEBUG
    org.springframework.security: INFO
